name: dm_plays
description: A streaming app combining the best of Netflix and Prime UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- VIDEO ENGINE (Core) ---
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  
  # --- VIDEO ENGINE (Platform Specifics) ---
  # For Android (Phones/TV)
  media_kit_libs_android_video: ^1.3.8

  # For Windows/Linux (Laptop) - FIXED VERSION HERE
  media_kit_libs_video: ^1.0.7

  # --- STANDARD PACKAGES ---
  http: ^1.1.0
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png" 
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/